name: CI gkt-4-fortran

on:
  push:
    branches: [gtk4-vmagnin, gtk4]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'src/cfwrapper/**'
      - 'screenshots/**'
      - 'logo/**'
      - 'tutorials/**'
      - '**.md'
      - '**.sh'
      - '**.py'
      - '**.toml'
  pull_request:
    branches: [gtk4]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake pkg-config libgtk-4-dev libplplot-dev plplot-driver-cairo

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc gtk4 plplot

      - name: Build with CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Tests (without GUI) with CMake CTest
        run: |
          ctest --test-dir build -R '^(regex|pixbuf_without_gui|tests)$'

      - name: Install fpm (Fortran Package Manager)
        uses: fortran-lang/setup-fpm@v12
        with:
          fpm-version: 'v0.14.0'

      - name: fpm build + test
        run: |
          fpm build
          fpm test
