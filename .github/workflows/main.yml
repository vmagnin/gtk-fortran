name: CI gtk-4-fortran

on:
  push:
    branches: [gtk4-vmagnin, gtk4]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - 'src/cfwrapper/**'
      - 'screenshots/**'
      - 'logo/**'
      - 'tutorials/**'
      - '**.md'
      - '**.sh'
      - '**.py'
      - '**.toml'
  pull_request:
    branches: [gtk4]

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake pkg-config libgtk-4-dev libplplot-dev plplot-driver-cairo

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc gtk4 plplot

      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: false
          release: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc-fortran
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-gtk4
            mingw-w64-ucrt-x86_64-plplot

      - name: Build with CMake (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Build with CMake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Tests (without GUI) with CMake CTest (Windows)
        if: runner.os == 'Windows'
        run: |
          ctest --test-dir build -R '^(regex|pixbuf_without_gui|tests)$'
        shell: msys2 {0}

      - name: Tests (without GUI) with CMake CTest (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          ctest --test-dir build -R '^(regex|pixbuf_without_gui|tests)$'

      - name: Install fpm (Fortran Package Manager)
        uses: fortran-lang/setup-fpm@v12
        with:
          fpm-version: 'v0.14.0'

      - name: fpm build + test (Windows)
        if: runner.os == 'Windows'
        run: |
          fpm build
          fpm test
        shell: msys2 {0}

      - name: fpm build + test (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          fpm build
          fpm test
