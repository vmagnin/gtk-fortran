name: CI

on:
  push:
    branches: [gtk4-vmagnin, gtk4]
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
  pull_request:

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran cmake pkg-config libgtk-4-dev libplplot-dev plplot-driver-cairo xvfb

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install gcc gtk4 plplot

      - name: Build with CMake
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Build and test with fpm
        uses: fortran-lang/setup-fpm@v7
        with:
          fpm-version: 'latest'

      - name: fpm build + test
        run: |
          fpm build
          fpm test
